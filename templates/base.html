<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Salesforce Architecture Trainer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        body {
            padding-top: 20px;
            padding-bottom: 40px;
        }
        .module-card {
            transition: transform 0.2s;
            height: 100%;
        }
        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .module-card.completed {
            border-left: 4px solid #28a745;
        }
        .module-card.in-progress {
            border-left: 4px solid #ffc107;
        }
        .module-icon {
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            border-radius: 50%;
        }
        .key-highlight {
            background-color: #f8f9fa;
            border-left: 4px solid #0d6efd;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .quiz-container {
            background-color: #f8f9fa;
            border-radius: 5px;
            padding: 1.5rem;
            margin: 2rem 0;
        }
        .quiz-option {
            padding: 10px 15px;
            margin: 8px 0;
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quiz-option:hover {
            background-color: #e9ecef;
        }
        .quiz-option.selected {
            border-color: #0d6efd;
        }
        .quiz-option.correct {
            background-color: #d4edda;
            border-color: #28a745;
        }
        .quiz-option.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
        }
        .quiz-feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .progress-indicator {
            height: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center text-decoration-none">
                <i class="bi bi-layers-half me-2 text-primary" style="font-size: 1.5rem;"></i>
                <span class="fs-4">Salesforce Architecture Trainer</span>
            </a>
            <div>
                <button id="reset-progress-btn" class="btn btn-sm btn-outline-secondary me-2">
                    <i class="bi bi-arrow-repeat"></i> Reset Progress
                </button>
                <button id="theme-toggle-btn" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-moon"></i>
                </button>
            </div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="pt-4 my-5 text-muted border-top">
            <div class="row">
                <div class="col-12 col-md">
                    <small class="d-block mb-3">Salesforce Architecture Trainer &copy; 2023</small>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Theme toggle
        document.getElementById('theme-toggle-btn').addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
            const icon = this.querySelector('i');
            if (icon.classList.contains('bi-moon')) {
                icon.classList.replace('bi-moon', 'bi-sun');
            } else {
                icon.classList.replace('bi-sun', 'bi-moon');
            }
            // Save theme preference
            const isDarkTheme = document.body.classList.contains('dark-theme');
            localStorage.setItem('darkTheme', isDarkTheme);
        });

        // Reset progress
        document.getElementById('reset-progress-btn').addEventListener('click', function() {
            if (confirm('Are you sure you want to reset your progress? This cannot be undone.')) {
                fetch('/api/reset-progress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.reload();
                    }
                });
            }
        });

        // Apply saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('darkTheme');
            if (savedTheme === 'true') {
                document.body.classList.add('dark-theme');
                document.getElementById('theme-toggle-btn').querySelector('i')
                    .classList.replace('bi-moon', 'bi-sun');
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>

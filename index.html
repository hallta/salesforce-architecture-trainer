<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Architecture Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="p-3 bg-primary text-white">
            <div class="container d-flex justify-content-between align-items-center">
                <h1 class="fs-4 mb-0">Salesforce Architecture Trainer</h1>
                <div class="d-flex">
                    <button id="progress-btn" class="btn btn-sm btn-outline-light me-2">
                        <i class="bi bi-graph-up"></i> Progress
                    </button>
                    <button id="theme-toggle" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-moon"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="container py-4">
            <section id="module-selection" class="mb-4">
                <h2 class="mb-3">Modules</h2>
                <div id="modules-grid" class="row row-cols-1 row-cols-md-3 g-4"></div>
            </section>

            <section id="module-content" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <button id="back-btn" class="btn btn-outline-primary">
                        <i class="bi bi-arrow-left"></i> Back to Modules
                    </button>
                    <div class="module-navigation">
                        <button id="prev-btn" class="btn btn-sm btn-outline-primary me-2">
                            <i class="bi bi-chevron-left"></i> Previous
                        </button>
                        <button id="next-btn" class="btn btn-sm btn-outline-primary">
                            Next <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                </div>
                <div id="module-container" class="card p-4"></div>
            </section>

            <div id="progress-modal" class="modal fade" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Your Progress</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div id="progress-stats" class="mb-3"></div>
                            <div id="progress-list" class="list-group"></div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
